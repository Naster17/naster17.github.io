name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "PUBLIC_GISCUS_REPO=${{ secrets.GISCUS_REPO }}" >> .env
          echo "PUBLIC_GISCUS_REPO_ID=${{ secrets.GISCUS_REPO_ID }}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY=${{ secrets.GISCUS_CATEGORY }}" >> .env
          echo "PUBLIC_GISCUS_CATEGORY_ID=${{ secrets.GISCUS_CATEGORY_ID }}" >> .env
          echo "PUBLIC_GISCUS_THEME=${{ secrets.GISCUS_THEME }}" >> .env
        shell: bash
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: .
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
